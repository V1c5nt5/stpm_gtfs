const OTHER_GROUP = 'Otros recorridos';

// Orden de las agencias en la lista (las que no coincidan van después, alfabéticamente)
function groupRank(name){
  const n = norm(name);
  if (name === OTHER_GROUP) return 99;
  if (/red metropolitana/.test(n)) return 0;
  if (/metro de santiago/.test(n)) return 1;
  if (/\befe\b|trenes de chile|metrotren/.test(n)) return 2;
  if (/acercamiento|aeropuerto/.test(n)) return 3;
  return 10;
}

function buildIndexes(g){
  g.routesById   = new Map(g.routes.map(r => [r.route_id, r]));
  g.stopsById    = new Map(g.stops.map(s => [s.stop_id, s]));
  g.calendarById = new Map(g.calendar.map(c => [c.service_id, c]));
  g.agenciesById = new Map(g.agency.map(a => [a.agency_id, a]));

  g.tripsByRoute = new Map();
  for (const t of g.trips){
    let arr = g.tripsByRoute.get(t.route_id);
    if (!arr){ arr = []; g.tripsByRoute.set(t.route_id, arr); }
    arr.push(t);
  }

  g.calendarDatesByService = new Map();
  for (const cd of g.calendarDates){
    let arr = g.calendarDatesByService.get(cd.service_id);
    if (!arr){ arr = []; g.calendarDatesByService.set(cd.service_id, arr); }
    arr.push(cd);
  }

  g.freqByTrip = new Map();
  for (const f of g.frequencies){
    let arr = g.freqByTrip.get(f.trip_id);
    if (!arr){ arr = []; g.freqByTrip.set(f.trip_id, arr); }
    arr.push(f);
  }

  const heads = new Map();
  for (const t of g.trips){
    if (!t.trip_headsign) continue;
    let s = heads.get(t.route_id);
    if (!s){ s = new Set(); heads.set(t.route_id, s); }
    s.add(t.trip_headsign);
  }
  g.headsignsByRoute = heads;

  // Categoría = nombre de agencia (agency_name del agency.txt del GTFS)
  for (const r of g.routes){
    const ag = g.agenciesById.get(r.agency_id) || (g.agency.length === 1 ? g.agency[0] : null);
    r.__agency = (ag && (ag.agency_name || '').trim()) || OTHER_GROUP;
  }
  g.groups = [...new Set(g.routes.map(r => r.__agency))]
    .sort((a, b) => (groupRank(a) - groupRank(b)) || a.localeCompare(b, 'es'));
  const groupIdx = new Map(g.groups.map((n, i) => [n, i]));
  g.groupCount = g.groups.length;

  for (const r of g.routes){
    r.__group = groupIdx.get(r.__agency);
    const hs = heads.get(r.route_id);
    r.__search = norm(
      (r.route_short_name || '') + ' ' + (r.route_long_name || '') + ' ' +
      (r.route_desc || '') + ' ' + r.__agency + ' ' + (hs ? [...hs].join(' ') : '')
    );
  }

  buildEntries(g);
  g.routes.sort((a,b) =>
    (a.__group - b.__group) ||
    (a.route_short_name || a.route_id).localeCompare(
      b.route_short_name || b.route_id, 'es', { numeric: true, sensitivity: 'base' })
  );
}

// Título según cómo termina el código: y / y1 / y2 → inyección · x → especial · otro → sin información
const APOYO_TITLE = 'Servicio de Apoyo';
// T + operador (1 o 2 dígitos) + 9 + 1 dígito: T293, T1290, T1590, T1996… (con o sin variante "00I")
function isApoyoCode(code){
  return /^T\d{1,2}9\d$/i.test(stripVar(code));
}
function injTitle(code){
  const c = String(code == null ? '' : code).trim();
  if (isApoyoCode(c)) return APOYO_TITLE;
  if (/y[12]?$/i.test(c)) return 'Servicio de Inyección';
  if (/x2?$/i.test(c)) return 'Servicio Especial';
  return 'Sin Información';
}
const NO_MATCH  = 'SIN MATCH';
const NO_OP     = '(Sin operadora)';
const lc = v => (v == null ? '' : String(v)).trim().toLowerCase();

// SIN MATCH primero, luego operadoras de la U más baja a la más alta (U2, U3, … U19)
function subRank(sub){
  if (sub == null) return -2;
  if (sub === NO_MATCH) return -1;
  const m = sub.match(/^\s*U\s*(\d+)/i);
  return m ? parseInt(m[1], 10) : 1000;
}

/* Cruza el DECO con el GTFS dentro de "Red Metropolitana de Movilidad".
   Match = MISMO literal de CODIGO_USUARIO ↔ route_short_name (sin distinguir mayúsculas;
   "506y" y "506y2" NO se unen).
   - Recorrido GTFS con match      → subcategoría = CLI_DSC (operadora)
   - Recorrido GTFS sin match      → subcategoría "SIN MATCH"
   - CODIGO_USUARIO sin recorrido  → recorrido gris "Recorrido Inyección / Sin Identificación" */
function applyDeco(g){
  const rm = g.groups.findIndex(n => /red metropolitana/.test(norm(n)));
  if (!g.deco || rm < 0) return;

  const map = new Map();
  for (const row of g.deco.rows){
    const code = (row.CODIGO_USUARIO || '').trim();
    if (!code) continue;
    const op = (row.CLI_DSC || '').trim() || NO_OP;
    let e = map.get(lc(code));
    if (!e){ e = { code, ops: new Map(), matched: false }; map.set(lc(code), e); }
    let o = e.ops.get(op);
    if (!o){ o = { n: 0, y: 0 }; e.ops.set(op, o); }
    o.n++;
    if (/y$/i.test((row.CODIGO_MTT || '').trim())) o.y++;   // CODIGO_MTT tipo "1321y" = inyección
  }

  for (const r of g.routes.slice()){
    const e = map.get(lc(r.route_short_name)) || map.get(lc(r.route_id));
    if (e) e.matched = true;
    if (r.__group !== rm) continue;
    r.__subs = e ? [...e.ops.keys()] : [tsSub(g, r.route_short_name) || NO_MATCH];
    // Si TODOS los CODIGO_MTT de esa operadora terminan en "y" (inyección), se muestra con "y": 421 → 421y
    if (e){
      const base = r.route_short_name || r.route_id;
      r.__subLabel = new Map();
      for (const [op, o] of e.ops){
        if (o.n > 0 && o.y === o.n && !/y$/i.test(base)) r.__subLabel.set(op, base + 'y');
      }
    }
  }

  let inj = 0;
  for (const e of map.values()){
    if (e.matched) continue;
    for (const op of e.ops.keys()){
      const r = {
        route_id: '__inj:' + lc(e.code) + '|' + op,
        route_short_name: e.code,
        route_long_name: injTitle(e.code),
        route_color: '9A9AA0', route_text_color: 'FFFFFF',
        __inj: true, __agency: g.groups[rm], __group: rm, __subs: [op],
        __search: norm(e.code + ' ' + injTitle(e.code) + ' ' + g.groups[rm])
      };
      g.routes.push(r); g.routesById.set(r.route_id, r);
      inj++;
    }
  }
  g.decoStats = { inj, noMatch: g.routes.filter(r => r.__subs && r.__subs[0] === NO_MATCH).length };
}

// Orden de las categorías: 1 PLAN CONTINGENCIA RED (-1) · 2 SIN MATCH (-0.5) · 3 Red Metropolitana (0) · Metro · EFE · Acercamiento
const SM_GROUP = -0.5;
const SM_TITLE = 'SIN MATCH (CÓDIGOS SIN REGISTRO)';
function eg(e){ return (e.sub === NO_MATCH && !e.r.__unc) ? SM_GROUP : e.r.__group; }

const entryCmp = (a, b) =>
  (eg(a) - eg(b)) ||
  ((a.r.__unc ? 1 : 0) - (b.r.__unc ? 1 : 0)) ||
  (subRank(a.sub) - subRank(b.sub)) ||
  String(a.sub || '').localeCompare(String(b.sub || ''), 'es') ||
  ((TS_RE.test(b.label) ? 1 : 0) - (TS_RE.test(a.label) ? 1 : 0)) ||
  a.label.localeCompare(b.label, 'es', { numeric: true, sensitivity: 'base' });

// Lista plana (recorrido + subcategoría). Un recorrido con 2 operadoras aparece en ambas.
function buildEntries(g){
  buildDecoIdx(g);
  applyDeco(g);
  const out = [];
  for (const r of g.routes){
    for (const sub of (r.__subs || [null])){
      const label = (r.__subLabel && r.__subLabel.get(sub)) || r.route_short_name || r.route_id;
      out.push({ r, sub, label, key: r.route_id + '|' + (sub || ''),
                 search: r.__search + ' ' + norm(label) + ' ' + norm(sub || '') });
    }
  }
  out.sort(entryCmp);
  g.entries = out;
  indexEntries(g);

  // Color de cada subcategoría = color (route_color) más común entre sus recorridos
  const tally = new Map();
  for (const e of out){
    if (e.sub == null || e.r.__inj) continue;
    const c = normalizeColor(e.r.route_color); if (!c) continue;
    const k = e.r.__group + '|' + e.sub;
    let m = tally.get(k); if (!m){ m = new Map(); tally.set(k, m); }
    m.set(c, (m.get(c) || 0) + 1);
  }
  g.subColor = new Map();
  for (const [k, m] of tally) g.subColor.set(k, [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]);
}

function renderResults(query){
  const g = state.gtfs;
  if (!g) return;
  const q = norm(query);
  const inCont = e => e.sub === NO_MATCH && g.contCodes && (g.contCodes.has(lc(e.label)) || g.contCodes.has(lc(e.r.route_short_name)));
  const base = g.entries.filter(e => !inCont(e));
  const list = q ? base.filter(e => e.search.includes(q)) : base;

  const uniq = new Set(list.map(e => e.r.route_id)).size;
  $('count').textContent = uniq.toLocaleString('es') + (uniq === 1 ? ' recorrido' : ' recorridos');

  const el = $('results');
  el.innerHTML = '';

  if (!list.length){
    el.innerHTML = '<div class="empty-list">Sin resultados</div>';
    return;
  }

  const subCount = new Map();
  for (const e of list){
    if (e.sub != null && e.sub !== NO_MATCH){ const k = e.r.__group + '|' + e.sub; subCount.set(k, (subCount.get(k) || 0) + 1); }
  }

  const frag = document.createDocumentFragment();
  let lastGroup = null, lastSub;

  for (const e of list){
    const r = e.r;
    const egv = eg(e);
    if (egv !== lastGroup){
      lastGroup = egv; lastSub = undefined;
      if (g.groupCount > 1 || egv === CONT_GROUP || egv === SM_GROUP){
        const sep = document.createElement('div');
        sep.className = 'group-sep';
        sep.textContent = egv === CONT_GROUP ? CONT_TITLE : egv === SM_GROUP ? SM_TITLE : g.groups[egv];
        if (egv === CONT_GROUP) sep.classList.add('cont');
        frag.appendChild(sep);
      }
    }
    if (e.sub !== lastSub){
      lastSub = e.sub;
      if (e.sub != null && e.sub !== NO_MATCH){
        const sep = document.createElement('div');
        sep.className = 'sub-sep' + (e.sub === NO_MATCH ? ' nomatch' : '');
        sep.style.borderLeftColor = g.subColor.get(r.__group + '|' + e.sub) || DEFAULT_COLOR;
        sep.innerHTML = escapeHtml(e.sub) + ' <span class="n">' + subCount.get(r.__group + '|' + e.sub) + '</span>';
        frag.appendChild(sep);
      }
    }

    const color = normalizeColor(r.route_color) || DEFAULT_COLOR;
    const tc = normalizeColor(r.route_text_color) || textColorFor(color);

    let dest, subTxt;
    if (r.__inj){
      dest = r.route_long_name; subTxt = '';
    } else if (r.__live){
      dest = r.__ts ? TS_TITLE : r.route_long_name;
      subTxt = r.__ts ? '' : (r.__own ? e.sub : (codeOperator(g, r.route_short_name) || 'Operador no identificado'));
    } else {
      const hs = g.headsignsByRoute.get(r.route_id);
      dest = hs ? [...hs].slice(0, 2).join(' · ') : '';
      if (!dest) dest = r.route_long_name || '';
      subTxt = r.route_long_name || '';
    }

    let subHtml = null;
    if (r.__unc){
      dest = 'Recorrido no confirmado'; subTxt = '';
    }
    if (e.cont && e.cont.items.length){
      subHtml = 'Apoyan:<br>' + contLines(e.cont).map(escapeHtml).join('<br>');
    }

    // Los "Recorrido Inyección / Sin Identificación" son solo informativos (no se pueden abrir),
    // salvo que tengan buses en tiempo real: ahí se abren para verlos.
    const clickable = !r.__unc && (!r.__inj || !!(g.liveBy && g.liveBy.has(e.key)));
    const btn = document.createElement(clickable ? 'button' : 'div');
    btn.className = 'route-item' + (r.__unc ? ' unc' : (clickable ? '' : ' inj')) + (e.cont ? ' cont' : '') + (e.key === state.entryKey ? ' active' : '');
    btn.dataset.id = r.route_id;
    btn.dataset.key = e.key;
    if (!clickable) btn.setAttribute('aria-disabled', 'true');
    btn.innerHTML =
      '<span class="route-badge" style="background:' + color + ';color:' + tc + '">' +
        escapeHtml(e.label) +
      '</span>' +
      '<span class="route-text">' +
        '<span class="route-dest">' + escapeHtml(dest || '—') + '</span>' +
        (subHtml ? '<span class="route-sub">' + subHtml + '</span>' : (subTxt ? '<span class="route-sub">' + escapeHtml(subTxt) + '</span>' : '')) +
      '</span>';
    if (clickable) btn.addEventListener('click', () => selectRoute(r.route_id, e));
    frag.appendChild(btn);
  }

  el.appendChild(frag);
}

$('search').addEventListener('input', e => renderResults(e.target.value));

function selectRoute(routeId, entry){
  state.routeId = routeId;
  state.entryKey = entry ? entry.key : null;
  state.label = entry ? entry.label : null;
  state.sub = entry ? entry.sub : null;
  state.dir = null;
  state.shapeId = null;

  document.querySelectorAll('.route-item').forEach(el => {
    el.classList.toggle('active', state.entryKey ? el.dataset.key === state.entryKey : el.dataset.id === routeId);
  });

  renderDetail();
}

function isCircularTrip(tripId){
  const sts = state.gtfs.stopTimesByTrip.get(tripId);
  if (!sts || sts.length < 2) return false;
  return sts[0][1] === sts[sts.length - 1][1];
}

function getShapePoints(shapeId, tripId){
  if (shapeId && shapeId !== '__none__'){
    const pts = state.gtfs.shapesById.get(shapeId);
    if (pts && pts.length){
      return pts.filter(p => !isNaN(p[1]) && !isNaN(p[2])).map(p => [p[1], p[2]]);
    }
  }
  const sts = state.gtfs.stopTimesByTrip.get(tripId) || [];
  return sts.map(st => {
    const s = state.gtfs.stopsById.get(st[1]);
    return s ? [+s.stop_lat, +s.stop_lon] : null;
  }).filter(p => p && !isNaN(p[0]) && !isNaN(p[1]));
}

function getActiveDays(serviceIds){
  const active = new Set();
  const g = state.gtfs;
  for (const sid of serviceIds){
    const c = g.calendarById.get(sid);
    if (c) DAYS.forEach((d, i) => { if (String(c[d]).trim() === '1') active.add(i); });

    const dates = g.calendarDatesByService.get(sid) || [];
    if (!c){
      for (const cd of dates){
        if (cd.exception_type === '1' && cd.date && cd.date.length === 8){
          const dt = new Date(+cd.date.slice(0,4), +cd.date.slice(4,6)-1, +cd.date.slice(6,8));
          active.add((dt.getDay() + 6) % 7);
        }
      }
    }
  }
  return active;
}

const DAY_SEC = 86400;

/* Un "segmento" es un tramo continuo de servicio [inicio, fin] en segundos.
   - Viajes con frequencies.txt: cada franja es un segmento (con headway muy largo,
     >1 h, solo cuentan las salidas reales, no toda la franja).
   - Viajes sin frequencies: se toma la primera salida como punto. */
function collectSegments(trips){
  const g = state.gtfs, segs = [], pts = [];
  for (const t of trips){
    const fr = g.freqByTrip.get(t.trip_id);
    if (fr){
      for (const f of fr){
        const a = toSec(f.start_time), b = toSec(f.end_time), h = +f.headway_secs;
        if (a === null || b === null) continue;
        if (!(b > a)){ pts.push(a); continue; }
        if (h > 3600) segs.push([a, a + Math.floor((b - a - 1) / h) * h]);
        else segs.push([a, b]);
      }
      continue;
    }
    const sts = g.stopTimesByTrip.get(t.trip_id);
    if (!sts || !sts.length) continue;
    const s = toSec(sts[0][3] || sts[0][2]);
    if (s !== null) pts.push(s);
  }
  return { segs, pts };
}

/* Une los segmentos en ventanas de horario. NO hay límite de ventanas:
   un recorrido puede tener 01:00–02:30 y 05:30–23:00 y las que hagan falta.
   Dos tramos se separan cuando la pausa entre ellos supera ~1,5 h. */
function serviceWindows(col){
  if (!col) return null;
  const D = DAY_SEC;
  const items = [];
  const add = (a, b, isSeg) => {
    if (b < a) b = a;
    const k = Math.floor(a / D); a -= k * D; b -= k * D;      // inicio dentro del día de servicio [0, 24h)
    if (b - a > D) b = a + D;
    items.push([a, b, isSeg]);                                // b puede pasar de 24h (ej. 25:30 = 01:30)
  };
  col.segs.forEach(([a, b]) => add(a, b, true));
  col.pts.forEach(p => add(p, p, false));
  if (!items.length) return null;

  // Umbral de pausa: 1,5 h; si solo hay salidas sueltas muy espaciadas, se adapta (máx 4 h)
  let thr = 5400;
  const ps = [...new Set(col.pts.map(p => ((p % D) + D) % D))].sort((x, y) => x - y);
  if (ps.length >= 3){
    const gp = [];
    for (let i = 0; i < ps.length - 1; i++) gp.push(ps[i+1] - ps[i]);
    gp.sort((x, y) => x - y);
    thr = Math.min(14400, Math.max(5400, 1.5 * gp[Math.floor(gp.length / 2)]));
  }

  items.sort((x, y) => x[0] - y[0]);
  const m = [];
  for (const it of items){
    const last = m[m.length - 1];
    // Franjas de frecuencia: solo se unen si se tocan o solapan (así se informan TODOS los horarios).
    // Salidas sueltas (sin frecuencias): se agrupan con el umbral de pausa.
    const tol = (it[2] && last && last[2]) ? 60 : thr;
    if (last && it[0] - last[1] <= tol){ last[1] = Math.max(last[1], it[1]); last[2] = last[2] && it[2]; }
    else m.push([it[0], it[1], it[2]]);
  }

  // Si una ventana cruza la medianoche (fin > 24:00), absorbe las de madrugada que se solapen con ella
  for (const w of m){
    if (w[1] <= D) continue;
    for (let i = m.length - 1; i >= 0; i--){
      const o = m[i];
      if (o !== w && o[0] <= (w[1] - D) + thr){
        w[1] = Math.min(w[0] + D, Math.max(w[1], o[1] + D));
        m.splice(i, 1);
      }
    }
  }
  m.sort((x, y) => x[0] - y[0]);

  // "24 Horas" SOLO si el servicio es continuo y dura exactamente 24 h
  let is24 = false;
  if (m.length === 1) is24 = (m[0][1] - m[0][0]) >= D;
  return { is24, windows: m.map(([a, b]) => [a, b]) };
}

/* Nombre de una variante según su horario real:
   - Todo su servicio dentro de 06:00–10:00 (±30 min)  → Horario Punta Mañana
   - Todo su servicio dentro de 17:00–21:00 (±30 min)  → Horario Punta Tarde
   - En otro caso                                      → Variante */
const PUNTAS = [
  { name: 'Horario Punta Mañana', from: 6*3600 - 1800,  to: 10*3600 + 1800 },
  { name: 'Horario Punta Tarde',  from: 17*3600 - 1800, to: 21*3600 + 1800 },
];
function variantName(w){
  if (!w || !w.windows.length) return 'Variante';
  for (const pt of PUNTAS){
    if (w.windows.every(([a, b]) => b >= a && a >= pt.from && b <= pt.to)) return pt.name;
  }
  return 'Variante';
}

function windowsContain(w, nowSec, dur){
  if (!w) return false;
  for (const [a, b0] of w.windows){
    const b = (b0 < a ? b0 + DAY_SEC : b0) + dur;
    if ((nowSec >= a && nowSec <= b) || (nowSec + DAY_SEC >= a && nowSec + DAY_SEC <= b)) return true;
  }
  return false;
}

/* Grupos de día en que se muestra el horario */
const DAY_GROUPS = [
  { key: 'wk',  label: 'Horario Lunes a Viernes', days: [0,1,2,3,4] },
  { key: 'sat', label: 'Horario Sábado',          days: [5] },
  { key: 'sun', label: 'Horario Domingo',         days: [6] },
];

function serviceDaySet(sid){
  const g = state.gtfs;
  if (!g.__svcDays) g.__svcDays = new Map();
  if (!sid) return new Set([0,1,2,3,4,5,6]);
  let s = g.__svcDays.get(sid);
  if (!s){ s = getActiveDays([sid]); g.__svcDays.set(sid, s); }
  return s;
}

function windowsByDayGroup(trips){
  const out = {};
  for (const dg of DAY_GROUPS){
    const ts = trips.filter(t => {
      const ds = serviceDaySet(t.service_id);
      return dg.days.some(d => ds.has(d));
    });
    out[dg.key] = ts.length ? serviceWindows(collectSegments(ts)) : null;
  }
  return out;
}

function scheduleHtml(w){
  if (!w) return '<span class="sched-none">Sin servicio</span>';
  const full = w.is24 && w.windows.length === 1 && w.windows[0][0] === 0 && w.windows[0][1] >= DAY_SEC;
  const lines = full ? [] : w.windows.map(([a, b]) =>
    '<span class="sched-line">' + (a === b ? fmtSec(a) : fmtSec(a) + ' a ' + fmtSec(b)) + '</span>');
  return '<div class="sched-lines">' +
    (w.is24 ? '<span class="sched-24">24 Horas</span>' : '') + lines.join('') + '</div>';
}

function tripDuration(t){
  const sts = state.gtfs.stopTimesByTrip.get(t.trip_id);
  if (!sts || sts.length < 2) return 0;
  const a = toSec(sts[0][3] || sts[0][2]);
  const b = toSec(sts[sts.length-1][2] || sts[sts.length-1][3]);
  if (a === null || b === null || b <= a) return 0;
  return Math.min(b - a, 10800);
}

function runsToday(serviceId){
  const T = state.today;
  if (!serviceId) return true;
  if (T.cache.has(serviceId)) return T.cache.get(serviceId);
  const g = state.gtfs;
  let res;
  const ex = (g.calendarDatesByService.get(serviceId) || []).find(cd => cd.date === T.ymd);
  if (ex && ex.exception_type === '2') res = false;
  else if (ex && ex.exception_type === '1') res = true;
  else {
    const c = g.calendarById.get(serviceId);
    res = c ? String(c[DAYS[T.dow]]).trim() === '1' : getActiveDays([serviceId]).has(T.dow);
  }
  T.cache.set(serviceId, res);
  return res;
}

function renderDetail(){
  const g = state.gtfs;
  const route = g.routesById.get(state.routeId);
  if (!route) return;

  const nowD = new Date();
  state.today = {
    dow: (nowD.getDay() + 6) % 7,
    ymd: nowD.getFullYear() + String(nowD.getMonth()+1).padStart(2,'0') + String(nowD.getDate()).padStart(2,'0'),
    cache: new Map()
  };
  const nowSec = nowD.getHours()*3600 + nowD.getMinutes()*60 + nowD.getSeconds();

  $('detail-empty').hidden = true;
  $('detail-inner').hidden = false;
  $('stops').hidden = false;
  const cont = curCont();

  const color = normalizeColor(route.route_color) || DEFAULT_COLOR;
  const tc = normalizeColor(route.route_text_color) || textColorFor(color);

  const badge = $('detail-badge');
  badge.textContent = state.label || route.route_short_name || route.route_id;
  badge.style.background = cont ? CONT_COLOR : color;
  badge.style.color = cont ? '#1a1a1c' : tc;

  $('detail-title').textContent = route.route_long_name || 'Recorrido ' + (route.route_short_name || route.route_id);

  const ag = g.agenciesById.get(route.agency_id) || (g.agency.length === 1 ? g.agency[0] : null);
  let subTxt = ag ? (ag.agency_name || '') : (route.__agency || '');
  if (route.__subs){
    const ops = (state.sub && route.__subs.includes(state.sub)) ? [state.sub] : route.__subs;
    subTxt += (subTxt ? ' · ' : '') + ops.join(' / ');
  }
  if (route.__live && !route.__ts) subTxt = route.__own ? route.__subs[0] : (codeOperator(g, route.route_short_name) || 'Operador no identificado');
  $('detail-sub').textContent = cont ? CONT_TITLE + ' · Apoyan: ' + contLines(cont).join(' · ') : subTxt;

  const trips = g.tripsByRoute.get(route.route_id) || [];

  const dirMap = new Map();
  for (const t of trips){
    const d = (t.direction_id === '1') ? '1' : '0';
    let arr = dirMap.get(d);
    if (!arr){ arr = []; dirMap.set(d, arr); }
    arr.push(t);
  }

  let dirs = [...dirMap.keys()].sort();
  if (!dirs.length){
    const hasLive = !!(g.liveBy && g.liveBy.has(state.entryKey));
    if (route.__live || hasLive){ renderLiveOnly(route, true); return; }
    state.liveOnly = false;
    if (state.busLayer) state.busLayer.clearLayers();
    $('tabs').hidden = true;
    $('variant-note').textContent = '';
    $('variants').innerHTML = '';
    $('meta').innerHTML = '';
    $('stops-head').textContent = '';
    $('stops').innerHTML = '<div class="stop-row">' + (route.__inj
      ? 'Este código existe en el DECO, pero no coincide con ningún recorrido del GTFS cargado.'
      : 'Sin viajes registrados para este recorrido.') + '</div>';
    if (state.layer) state.layer.clearLayers();
    return;
  }

  let circular = false;
  if (dirs.includes('0')){
    const rep = dirMap.get('0').find(t => (g.stopTimesByTrip.get(t.trip_id) || []).length > 1);
    if (rep && isCircularTrip(rep.trip_id)){ circular = true; dirs = ['0']; }
  }

  if (!state.dir || !dirs.includes(state.dir)) state.dir = dirs[0];
  state.showAllDirs = dirs.length === 1;
  state.liveOnly = false;

  const tabsEl = $('tabs');
  tabsEl.innerHTML = '';
  if (dirs.length > 1){
    const labels = { '0': 'Ida', '1': 'Regreso' };
    for (const d of dirs){
      const b = document.createElement('button');
      b.className = 'tab' + (d === state.dir ? ' active' : '');
      b.textContent = labels[d] || ('Sentido ' + d);
      b.addEventListener('click', () => {
        state.dir = d; state.shapeId = null; renderDetail();
      });
      tabsEl.appendChild(b);
    }
    tabsEl.hidden = false;
  } else {
    tabsEl.hidden = true;
  }

  const dirTrips = dirMap.get(state.dir) || [];

  const shapeMap = new Map();
  for (const t of dirTrips){
    const sid = t.shape_id || '__none__';
    let arr = shapeMap.get(sid);
    if (!arr){ arr = []; shapeMap.set(sid, arr); }
    arr.push(t);
  }

  const nStops = t => (g.stopTimesByTrip.get(t.trip_id) || []).length;
  const bestTrip = ts => ts.reduce((a,b) => nStops(b) > nStops(a) ? b : a, ts[0]);

  const shapes = [...shapeMap.entries()].sort((a,b) => b[1].length - a[1].length);

  const variantInfo = new Map();
  let maxTime = -1;
  let mainVariantId = null;

  for (const [sid, ts] of shapes){
    const rep = bestTrip(ts);
    const todayTrips = ts.filter(t => runsToday(t.service_id));
    const allWindows = serviceWindows(collectSegments(ts));
    
    let totalTime = 0;
    if (allWindows) {
      if (allWindows.is24) totalTime = 86400; // Mantenemos el peso principal para el 24h
      else {
        for (const [a, b] of allWindows.windows) {
          totalTime += b >= a ? (b - a) : (86400 - a + b);
        }
      }
    }

    variantInfo.set(sid, {
      rep,
      dur: tripDuration(rep),
      all: allWindows,
      today: todayTrips.length ? serviceWindows(collectSegments(todayTrips)) : null,
      active: false,
      totalTime
    });

    if (totalTime > maxTime) {
      maxTime = totalTime;
      mainVariantId = sid;
    }
  }

  const anyToday = [...variantInfo.values()].some(v => v.today);
  for (const v of variantInfo.values()){
    v.active = windowsContain(anyToday ? v.today : v.all, nowSec, v.dur);
  }

  let currentShape = state.shapeId;
  if (!currentShape || !shapeMap.has(currentShape)){
    const hit = shapes.find(([sid]) => variantInfo.get(sid).active);
    currentShape = (hit || shapes[0])[0];
  }
  state.shapeId = currentShape;

  const shapeTrips = shapeMap.get(currentShape) || [];
  const curInfo = variantInfo.get(currentShape);
  const repTrip = curInfo.rep;

  const variantsEl = $('variants'), noteEl = $('variant-note');
  variantsEl.innerHTML = '';
  noteEl.textContent = '';
  if (shapes.length > 1){
    const hasMainVariant = maxTime > 43200; // >12 horas indica "mayor parte del día"

    shapes.forEach(([sid], i) => {
      const info = variantInfo.get(sid);
      const b = document.createElement('button');
      const isNormal = hasMainVariant && sid === mainVariantId;

      b.className = 'variant' + (sid === currentShape ? ' active' : '');
      const vName = isNormal ? 'Horario Normal' : variantName(info.all);
      b.innerHTML = vName + (info.active ? '<span class="now">● ahora</span>' : '');
      b.title = info.rep.trip_headsign || vName;
      
      if (isNormal) {
        b.style.backgroundColor = (sid === currentShape) ? '#ececef' : '#ffffff';
        b.style.borderColor = (sid === currentShape) ? '#1a1a1c' : '#d6d6db';
        b.style.color = '#1a1a1c';
        b.onmouseover = () => { if (sid !== currentShape) b.style.backgroundColor = '#f2f2f4'; };
        b.onmouseout = () => { if (sid !== currentShape) b.style.backgroundColor = '#ffffff'; };
      }

      b.addEventListener('click', () => { state.shapeId = sid; renderDetail(); });
      variantsEl.appendChild(b);
    });
    const isCurrentNormal = hasMainVariant && currentShape === mainVariantId;
    const bits = [isCurrentNormal ? 'Horario Normal' : variantName(curInfo.all)];
    if (repTrip.trip_headsign) bits.push('hacia ' + repTrip.trip_headsign);
    bits.push(nStops(repTrip) + ' paraderos');
    noteEl.textContent = bits.join(' · ');
  }

  const serviceIds = new Set();
  for (const t of shapeTrips) if (t.service_id) serviceIds.add(t.service_id);
  const activeDays = getActiveDays(serviceIds);

  const byGroup = windowsByDayGroup(shapeTrips);

  let metaHtml =
    '<div class="meta-block">' +
      '<span class="meta-label">Días de operación</span>' +
      '<span class="days">' +
        DAYS.map((d,i) =>
          '<span class="day' + (activeDays.has(i) ? ' on' : '') + '">' + DAY_LBL[i] + '</span>'
        ).join('') +
      '</span>' +
    '</div>' +
    '<span class="meta-sep"></span>' +
    DAY_GROUPS.map(dg =>
      '<div class="meta-block">' +
        '<span class="meta-label">' + dg.label + '</span>' +
        scheduleHtml(byGroup[dg.key]) +
      '</div>'
    ).join('');

  if (dirs.length > 1 || circular) {
    metaHtml +=
      '<div class="meta-block">' +
        '<span class="meta-label">Sentido</span>' +
        '<span class="meta-value">' +
          (dirs.length === 1
            ? 'Circular'
            : (state.dir === '0' ? 'Ida' : 'Regreso')) +
        '</span>' +
      '</div>';
  }

  $('meta').innerHTML = metaHtml;

  const sts = g.stopTimesByTrip.get(repTrip.trip_id) || [];

  $('stops-head').textContent = 'Paraderos · ' + sts.length + ' en total';

  const stopsEl = $('stops');
  stopsEl.innerHTML = '';

  const mapPoints = getShapePoints(currentShape, repTrip.trip_id);
  const mapStops = [];

  const frag = document.createDocumentFragment();
  sts.forEach((st, i) => {
    const s = g.stopsById.get(st[1]);
    const name = s ? (s.stop_name || st[1]) : st[1];
    if (s) mapStops.push({ lat: +s.stop_lat, lng: +s.stop_lon, name, idx: i });

    const row = document.createElement('div');
    row.className = 'stop-row';
    row.dataset.idx = i;
    row.innerHTML =
      '<span class="stop-rail"><span class="stop-dot"></span></span>' +
      '<span class="stop-idx">' + (i+1) + '</span>' +
      '<span class="stop-name">' + escapeHtml(name) + '</span>';
    row.addEventListener('click', () => {
      const mk = row._marker;
      if (mk && state.map){
        state.map.setView(mk.getLatLng(), Math.max(state.map.getZoom(), 16));
        mk.openPopup();
      }
    });
    frag.appendChild(row);
  });
  stopsEl.appendChild(frag);

  drawMap(mapPoints, mapStops, color, stopsEl);
}

function mapMessage(msg){
  const el = $('map-msg');
  el.textContent = msg || '';
  el.hidden = !msg;
}

function ensureMap(){
  if (state.map) return state.map;
  if (typeof L === 'undefined') return null;
  const map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  map.setView([-33.45, -70.66], 11);
  state.layer = L.layerGroup().addTo(map);
  state.map = map;
  return map;
}

async function drawMap(points, stops, color, stopsEl){
  if (typeof L === 'undefined'){
    mapMessage('Cargando mapa…');
    try { await libLeaflet; }
    catch (e){ mapMessage('No se pudo cargar el mapa (se necesita conexión a internet). La lista de paraderos sí está disponible.'); return; }
  }
  mapMessage('');
  const map = ensureMap();
  if (!map) return;

  map.invalidateSize();
  state.layer.clearLayers();

  if (points.length > 1){
    const line = L.polyline(points, {
      color, weight: 4, opacity: 0.9, lineJoin: 'round', lineCap: 'round'
    }).addTo(state.layer);
    map.fitBounds(line.getBounds(), { padding: [28, 28] });
  } else {
    const valid = stops.filter(s => !isNaN(s.lat) && !isNaN(s.lng));
    if (valid.length) map.fitBounds(valid.map(s => [s.lat, s.lng]), { padding: [28, 28], maxZoom: 16 });
    else mapMessage('Este recorrido no tiene coordenadas para mostrar en el mapa.');
  }

  stops.forEach(s => {
    if (isNaN(s.lat) || isNaN(s.lng)) return;
    const m = L.circleMarker([s.lat, s.lng], {
      radius: 4.5, color: '#fff', weight: 1.6,
      fillColor: color, fillOpacity: 1
    }).addTo(state.layer);
    m.bindPopup('<b>' + (s.idx + 1) + '.</b> ' + escapeHtml(s.name));

    const row = stopsEl.querySelector('.stop-row[data-idx="' + s.idx + '"]');
    if (row) row._marker = m;
  });

  state.busColor = color;
  drawBuses(false);

  setTimeout(() => map.invalidateSize(), 50);
}

/* =====================================================================
   BUSES EN TIEMPO REAL
   Fuente: https://velocidades.seguimos.cl/?all-buses-data=1  (GeoJSON, un Point por bus)
   Cada bus trae route_code, route_direction ("Ida"/"Regreso") y license_plate (PPU).

   Cómo se asigna cada bus a un recorrido de la lista (en este orden):
     1. route_code = CODIGO_RUTA del DECO            → ese servicio (y su operadora)
     2. route_code = CODIGO_USUARIO (ej. "B45")      → ese servicio (ya venía "matcheado")
     3. route_code sin variante/sentido ("T1466 03I" → "T1466", "T315 E0 02R" → "T315 E0")
        = CODIGO_RUTA sin variante/sentido           → ese servicio; si no calza completo,
        se prueba solo con el primer token ("T1816 C2 00R" → "T1816")
     4. CODIGO_MTT / SERVICIO_DECO                   → ese servicio
     5. recorrido del GTFS con ese nombre            → ese recorrido
     6. nada de lo anterior                          → recorrido sin informar en "SIN MATCH"
        (códigos TxTS, ej. T2TS, van dentro de la operadora UX: T2TS → "U2 - Su Bus")
   El sentido sale de route_direction (o del sufijo I/R del código) y se muestra en Ida / Regreso.
   Todas las variantes del servicio (T1466 00I, T1466 03I…) caen en el mismo Ida/Regreso.
   ===================================================================== */
/* version.json (data/version.json): { "version": "v1.0.4", "fecha": "04/10/26", "cambios": ["...", "..."] }
   Si el archivo no existe, no se muestra versión ni cambios. */
async function loadVersion(){
  try {
    const r = await fetch(RAW_BASE + 'version.json', { cache: 'no-store' });
    if (!r.ok) return null;
    let txt = await r.text();
    if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
    const j = JSON.parse(txt);
    return (j && typeof j === 'object') ? j : null;
  } catch (e){ return null; }
}
function versionLabel(v){
  if (!v) return '';
  return [v.version, v.fecha].filter(Boolean).map(String).join(' · ');
}
function renderChangelog(v){
  const el = $('changelog');
  if (!el) return;
  const list = v && Array.isArray(v.cambios) ? v.cambios.map(c => String(c).trim()).filter(Boolean) : [];
  if (!list.length){ el.hidden = true; el.innerHTML = ''; return; }
  const lbl = versionLabel(v);
  el.innerHTML = '<h4>Principales cambios' + (lbl ? ' <span>· ' + escapeHtml(lbl) + '</span>' : '') + '</h4>' +
    '<ul>' + list.map(c => '<li>' + escapeHtml(c) + '</li>').join('') + '</ul>';
  el.hidden = false;
}
const GPS_DOWN_MSG = 'Sin servicio GPS. Consultar más tarde';
const LIVE_URL = 'https://velocidades.seguimos.cl/?all-buses-data=1';
const LIVE_EVERY = 20000;   // ms entre actualizaciones
const LIVE_TITLE = 'Servicio Sin Registro';
const TS_RE = /^T(\d+)TS$/i;
const TS_TITLE = 'Transito a Servicio';
const CONT_TITLE = 'PLAN CONTINGENCIA RED';
const CONT_GROUP = -1;            // grupo propio, siempre antes que Metro y los demás
const CONT_COLOR = '#FFD000';
let contSig = null, contTimer = null;
// Directo primero; si el sitio no permite CORS, se prueba a través de proxies públicos.
const LIVE_PROXIES = [
  u => u,
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
];
let liveTimer = null, liveBusy = false, liveProxy = 0;

async function fetchLive(){
  const order = [liveProxy, ...LIVE_PROXIES.keys()].filter((v, i, a) => a.indexOf(v) === i);
  let lastErr = null;
  for (const i of order){
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(LIVE_PROXIES[i](LIVE_URL), { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const fc = j && (j.geojson || j);
      if (!fc || !Array.isArray(fc.features)) throw new Error('Formato inesperado');
      liveProxy = i;
      return fc.features;
    } catch (e){ lastErr = e; }
    finally { clearTimeout(to); }
  }
  throw lastErr || new Error('Sin respuesta');
}

const parseTs = s => {
  const t = Date.parse(String(s || '').replace(/([+-]\d\d)(\d\d)$/, '$1:$2'));
  return isNaN(t) ? null : t;
};

// "T1466 03I" → "T1466" · "T315 E0 02R" → "T315 E0" · "B45" → "B45"
function stripVar(code){
  const t = String(code == null ? '' : code).trim();
  const m = t.match(/^(.*?)\s+(\d{2})([IR])$/i);
  return m ? m[1].trim() : t;
}

function busDir(p, code){
  // TxTS: 00I = Ida y 00R = Regreso, sin importar lo que diga route_direction
  const sfx = String(code).match(/\s\d\d([IR])$/i);
  if (sfx && TS_RE.test(stripVar(code))) return sfx[1].toUpperCase();
  const d = lc(p.route_direction);
  if (d.startsWith('reg')) return 'R';
  if (d.startsWith('ida')) return 'I';
  const m = String(code).match(/\d\d([IR])$/i);
  return m ? m[1].toUpperCase() : '';
}

// Índices del DECO para resolver el route_code de cada bus
function buildDecoIdx(g){
  g.decoIdx = null;
  if (!g.deco) return;
  const ix = { user: new Set(), ruta: new Map(), prefix: new Map(), mtt: new Map() };
  const addSet = (map, k, v) => { let s = map.get(k); if (!s){ s = new Set(); map.set(k, s); } s.add(v); };
  for (const r of g.deco.rows){
    const u = lc(r.CODIGO_USUARIO);
    if (!u) continue;
    ix.user.add(u);
    const cr = lc(r.CODIGO_RUTA);
    if (cr){
      if (!ix.ruta.has(cr)) ix.ruta.set(cr, r);
      const p = lc(stripVar(r.CODIGO_RUTA));
      let a = ix.prefix.get(p); if (!a){ a = []; ix.prefix.set(p, a); }
      a.push(r);
    }
    for (const m of [r.CODIGO_MTT, r.SERVICIO_DECO]){
      const k = lc(m); if (k) addSet(ix.mtt, k, u);
    }
  }
  g.decoIdx = ix;
}

// Entradas de la lista por código de servicio (nombre corto / id del recorrido)
function indexEntries(g){
  g.entriesByUser = new Map();
  g.injKeys = new Set();
  g.liveEntries = g.liveEntries || new Map();
  for (const e of g.entries){
    if (e.r.__inj) g.injKeys.add(e.key);
    for (const k of new Set([lc(e.r.route_short_name), lc(e.r.route_id)])){
      if (!k) continue;
      let a = g.entriesByUser.get(k); if (!a){ a = []; g.entriesByUser.set(k, a); }
      a.push(e);
    }
  }
}

// Operadora (tal como viene en el DECO) a partir de su número: 2 → "U2 - Su Bus"
function opByNum(g, n){
  if (!g.deco) return null;
  if (!g.opByNum) g.opByNum = new Map();
  n = String(n);
  if (!g.opByNum.has(n)){
    const re = new RegExp('^\\s*U\\s*' + n + '(?!\\d)', 'i');
    const row = g.deco.rows.find(r => re.test(r.CLI_DSC || ''));
    g.opByNum.set(n, row ? row.CLI_DSC.trim() : null);
  }
  return g.opByNum.get(n);
}

// T2TS → "U2 - Su Bus" · T14TS → "U14 - VOY Santiago US14"
function tsSub(g, name){
  const m = TS_RE.exec(String(name == null ? '' : name).trim());
  return m ? opByNum(g, m[1]) : null;
}

// T1590 → U15 · T293 → U2 (número del código sin sus 2 últimos dígitos).
// "override" = operadora indicada en contingencia.json (ej. "U15").
function opForCode(g, label, override){
  let n = null;
  if (override){ const m = /(\d+)/.exec(String(override)); if (m) n = m[1]; }
  if (n == null){
    const m = /^T?(\d{3,4})(?!\d)/i.exec(String(label).trim());
    if (m) n = m[1].slice(0, -2);
  }
  return n ? opByNum(g, n) : null;
}

// Operador de un código según sus dígitos (T1590 → U15, T293 → U2, 294x → U2).
// Devuelve el nombre completo del DECO; si no está, solo "U15"; si no hay dígitos, ''.
function codeOperator(g, label){
  const its = g.contSupBy && g.contSupBy.get(lc(stripVar(label)));
  const ov = its && (its.find(i => i.op) || {}).op;
  const full = opForCode(g, label, ov);
  if (full) return full;
  let n = null;
  if (ov){ const m = /(\d+)/.exec(String(ov)); if (m) n = m[1]; }
  if (n == null){ const m = /^T?(\d{3,4})(?!\d)/i.exec(String(label).trim()); if (m) n = m[1].slice(0, -2); }
  return n ? 'U' + n : '';
}

const LIVE_INFO_MSG = 'Estamos recopilando más información sobre este recorrido...';

// Recorrido "sin informar": existe en el seguimiento de buses pero no en el DECO ni en el GTFS.
// TxTS → "Transito a Servicio" dentro de su operadora. Código de apoyo de contingencia → su operadora.
function liveEntry(g, label){
  // Código de un servicio con "apoyo": false en contingencia.json → recorrido manual dentro de su operadora
  const own = g.contOwn && g.contOwn.get(lc(label));
  if (own) return ownEntry(g, own);
  const m = TS_RE.exec(label);
  let sub = m ? tsSub(g, label) : null;
  if (!sub){
    const its = g.contSupBy && g.contSupBy.get(lc(label));
    if (its) sub = opForCode(g, label, (its.find(i => i.op) || {}).op);
  }
  sub = sub || NO_MATCH;
  const title = m ? TS_TITLE : (isApoyoCode(label) ? APOYO_TITLE : LIVE_TITLE);
  const rid = '__live:' + lc(label) + '|' + sub;
  let e = g.liveEntries.get(rid);
  if (e) return e;
  const rm = g.groups.findIndex(n => /red metropolitana/.test(norm(n)));
  const grp = rm >= 0 ? rm : 0;
  const r = {
    route_id: rid, route_short_name: label, route_long_name: title,
    route_color: '9A9AA0', route_text_color: 'FFFFFF',
    __live: true, __ts: !!m, __agency: g.groups[grp], __group: grp, __subs: [sub],
    __search: norm(label + ' ' + title + ' ' + g.groups[grp])
  };
  e = { r, sub, label, key: rid + '|' + sub, search: r.__search + ' ' + norm(label) + ' ' + norm(sub) };
  g.liveEntries.set(rid, e);
  g.routes.push(r); g.routesById.set(rid, r);
  g.entries.push(e);
  g.__liveAdded = true;
  return e;
}

// Servicio que aún no está en el DECO/GTFS pero se sabe a qué operadora pertenece (contingencia.json, apoyo:false):
// se crea como un recorrido normal (nombre del servicio) dentro de su operadora, fuera de SIN MATCH.
function ownEntry(g, own){
  const sub = ownSub(g, own);
  const label = own.servicio;
  const rid = '__live:' + lc(label) + '|' + sub;
  let e = g.liveEntries.get(rid);
  if (e) return e;
  const rm = g.groups.findIndex(x => /red metropolitana/.test(norm(x)));
  const grp = rm >= 0 ? rm : 0;
  const color = (g.subColor && g.subColor.get(grp + '|' + sub)) || '9A9AA0';
  const r = {
    route_id: rid, route_short_name: label, route_long_name: OWN_TITLE,
    route_color: color, route_text_color: textColorFor(normalizeColor(color) || DEFAULT_COLOR),
    __live: true, __own: true, __ts: false, __agency: g.groups[grp], __group: grp, __subs: [sub],
    __search: norm(label + ' ' + own.codigo + ' ' + sub + ' ' + g.groups[grp])
  };
  e = { r, sub, label, key: rid + '|' + sub, search: r.__search + ' ' + norm(label) + ' ' + norm(sub) };
  g.liveEntries.set(rid, e);
  g.routes.push(r); g.routesById.set(rid, r);
  g.entries.push(e);
  g.__liveAdded = true;
  return e;
}
const OWN_TITLE = 'Información en recopilación';
// Operadora (nombre del DECO) de un servicio con apoyo:false: la de "operadora" o la del código (T1826 → U18)
function ownSub(g, own){
  const n = own.op ? (/(\d+)/.exec(String(own.op)) || [])[1] : null;
  return opForCode(g, own.codigo, own.op) || (n ? 'U' + n : null) || ownOpNum(own.codigo) || NO_MATCH;
}
// Entradas del GTFS/DECO que corresponden al servicio de un código con apoyo:false (null si no existe en el GTFS)
function ownGtfsEntries(g, own){
  const list = (g.entriesByUser && g.entriesByUser.get(lc(own.servicio))) || [];
  const es = list.filter(e => !e.r.__live && !e.cont);
  if (!es.length) return null;
  const sub = ownSub(g, own);
  const f = es.filter(e => e.sub === sub);
  return f.length ? f : es;
}
function ownOpNum(code){
  const m = /^T?(\d{3,4})(?!\d)/i.exec(String(code).trim());
  return m ? 'U' + m[1].slice(0, -2) : null;
}

// Un recorrido sin informar solo existe mientras tenga buses: se quita de la lista
function dropLive(g, e){
  g.liveEntries.delete(e.r.route_id);
  const i = g.entries.indexOf(e); if (i >= 0) g.entries.splice(i, 1);
  g.routesById.delete(e.r.route_id);
  const j = g.routes.indexOf(e.r); if (j >= 0) g.routes.splice(j, 1);
}

// Si el recorrido que se estaba viendo ya no existe en la lista, se limpia el detalle
function ensureSelection(g){
  if (!state.entryKey || g.entries.some(e => e.key === state.entryKey)) return;
  state.routeId = null; state.entryKey = null; state.label = null; state.sub = null;
  state.dir = null; state.shapeId = null; state.liveOnly = false; state.openBus = null;
  $('detail-inner').hidden = true;
  $('detail-empty').hidden = false;
  if (state.busLayer) state.busLayer.clearLayers();
  if (state.layer) state.layer.clearLayers();
}

// route_code de un bus → entradas de la lista donde debe aparecer
function resolveEntries(g, rawCode){
  const code = String(rawCode == null ? '' : rawCode).trim();
  if (!code) return [];
  const c = lc(code), base = stripVar(code), p = lc(base), tok = p.split(/\s+/)[0];
  const out = [], seen = new Set();
  const push = es => { for (const e of es) if (!seen.has(e.key)){ seen.add(e.key); out.push(e); } };
  const byUser = (u, op) => {
    const list = g.entriesByUser.get(u) || [];
    const f = op ? list.filter(e => e.sub === op) : [];
    return f.length ? f : list;
  };

  // Código activado manualmente en contingencia.json (apoyo:false) y su servicio existe en el GTFS:
  // el bus va a ese recorrido (con su GTFS completo), sin pasar por el DECO.
  const own = g.contOwn && (g.contOwn.get(p) || g.contOwn.get(c));
  if (own){
    const es = ownGtfsEntries(g, own);
    if (es){ push(es); return out; }
  }

  const ix = g.decoIdx;
  if (ix){
    const hits = [];
    const row = ix.ruta.get(c);
    if (row) hits.push([lc(row.CODIGO_USUARIO), (row.CLI_DSC || '').trim()]);
    else if (ix.user.has(c)) hits.push([c, null]);
    else if (ix.user.has(p)) hits.push([p, null]);
    else {
      const rows = ix.prefix.get(p) || (tok !== p ? ix.prefix.get(tok) : null);
      if (rows){
        for (const r of rows) hits.push([lc(r.CODIGO_USUARIO), (r.CLI_DSC || '').trim()]);
      } else {
        const us = ix.mtt.get(c) || ix.mtt.get(p);
        if (us) for (const u of us) hits.push([u, null]);
      }
    }
    for (const [u, op] of hits) push(byUser(u, op));
  }
  if (!out.length){
    for (const k of [c, p, tok]){
      const es = g.entriesByUser.get(k);
      if (es){ push(es); break; }
    }
  }
  if (!out.length) push([liveEntry(g, base || code)]);
  return out;
}

// Reparte todos los buses del último GeoJSON entre las entradas de la lista
function applyLive(feats){
  const g = state.gtfs;
  if (!g || !g.entriesByUser) return;
  const by = new Map(), cache = new Map();
  const put = (key, d, bus) => {
    let b = by.get(key);
    if (!b){ b = { I: [], R: [], U: [] }; by.set(key, b); }
    b[d || 'U'].push(bus);
  };
  let total = 0;
  g.__liveAdded = false;

  for (const f of feats){
    const p = f && f.properties, co = f && f.geometry && f.geometry.coordinates;
    if (!p || !co) continue;
    const code = String(p.route_code == null ? '' : p.route_code).trim();
    if (!code) continue;
    const lat = +co[1], lng = +co[0];
    if (!isFinite(lat) || !isFinite(lng)) continue;
    let es = cache.get(code);
    if (!es){ es = resolveEntries(g, code); cache.set(code, es); }
    const d = busDir(p, code);
    const bus = { ppu: String(p.license_plate == null ? '' : p.license_plate).trim() || '—',
                  lat, lng, speed: p.speed, ts: parseTs(p.timestamp), code, dir: d };
    total++;
    for (const e of es) put(e.key, d, bus);

    // Apoyo de contingencia: el bus también se ve en el servicio apoyado (en amarillo)
    const sl = d && g.contSupBy && g.contSupBy.get(lc(stripVar(code)));
    if (sl) for (const s of sl) if (s.dir === d) put(s.key, s.en, Object.assign({}, bus, { sup: true }));
  }

  // Servicio en contingencia = sus propios buses + los buses de apoyo
  if (g.contEntries) for (const ce of g.contEntries.values()){
    const seen = new Set();
    for (const be of ce.cont.baseEntries){
      const b = by.get(be.key);
      if (!b) continue;
      for (const d of ['I', 'R', 'U']) for (const bus of b[d]){
        const k = bus.ppu + '|' + d;
        if (seen.has(k)) continue;
        seen.add(k); put(ce.key, d, bus);
      }
    }
  }

  // Recorridos sin informar que ya no tienen ningún bus: se sacan de la lista
  let removed = false;
  for (const e of [...g.liveEntries.values()]){
    if (!by.has(e.key)){ dropLive(g, e); removed = true; }
  }

  g.liveBy = by; g.liveTotal = total; g.liveAt = Date.now();
  if (g.__liveAdded) g.entries.sort(entryCmp);
  ensureSelection(g);

  // Se vuelve a dibujar la lista solo si cambió algo (nuevos/quitados o inyecciones con buses)
  const sig = [...by.keys()].filter(k => g.injKeys.has(k)).sort().join('\n');
  if (g.__liveAdded || removed || sig !== g.liveSig){
    g.liveSig = sig;
    const el = $('results'), top = el.scrollTop;
    renderResults($('search').value);
    el.scrollTop = top;
  }
  renderFileLabel();
  refreshDetailBuses();
}

// Buses del recorrido/sentido que se está viendo
function currentBuses(){
  const g = state.gtfs;
  if (!g || !g.liveBy || !state.entryKey) return [];
  const b = g.liveBy.get(state.entryKey);
  if (!b) return [];
  if (state.showAllDirs || state.dir == null) return [...b.I, ...b.R, ...b.U];
  return state.dir === '0' ? [...b.I, ...b.U] : [...b.R, ...b.U];
}

function busPopup(b){
  const t = b.ts ? new Date(b.ts).toLocaleTimeString('es-CL') : '';
  const dirTxt = b.dir === 'I' ? 'Ida' : b.dir === 'R' ? 'Regreso' : '';
  return '<b>' + escapeHtml(b.ppu) + '</b><br>' + escapeHtml(b.code) + (dirTxt ? ' · ' + dirTxt : '') + (b.sup ? ' · Apoyo' : '') +
    ((b.speed != null && b.speed !== '') ? '<br>' + Math.round(+b.speed) + ' km/h' : '') +
    (t ? (b.speed != null ? ' · ' : '<br>') + t : '');
}

// Círculo más grande que un paradero, con la PPU en un rectángulo arriba
function drawBuses(fit){
  const map = state.map;
  if (!map || typeof L === 'undefined') return;
  if (!state.busLayer) state.busLayer = L.layerGroup().addTo(map);
  const lyr = state.busLayer;
  state.redrawing = true;
  lyr.clearLayers();
  state.redrawing = false;

  const bs = currentBuses();
  const pts = [];
  for (const b of bs){
    pts.push([b.lat, b.lng]);
    const m = L.circleMarker([b.lat, b.lng], {
      radius: 9, color: '#1a1a1c', weight: 2,
      fillColor: b.sup ? CONT_COLOR : (state.busColor || DEFAULT_COLOR), fillOpacity: 1
    }).addTo(lyr);
    m.bindTooltip(escapeHtml(b.ppu), { permanent: true, direction: 'top', offset: [0, -9], className: 'bus-tip' });
    m.bindPopup(busPopup(b));
    m.on('popupopen', () => { state.openBus = b.ppu; });
    m.on('popupclose', () => { if (!state.redrawing && state.openBus === b.ppu) state.openBus = null; });
    if (state.openBus === b.ppu) m.openPopup();   // la actualización no cierra el popup abierto
  }
  if (state.liveOnly) mapMessage(bs.length ? '' : 'Sin buses reportando en este recorrido por ahora.');
  if (fit && pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
}

// Detalle de un recorrido sin trazado (sin informar / inyección sin GTFS): solo los buses
function renderLiveOnly(route, fresh){
  const g = state.gtfs;
  const color = normalizeColor(route.route_color) || DEFAULT_COLOR;
  const b = (g.liveBy && g.liveBy.get(state.entryKey)) || { I: [], R: [], U: [] };
  const dirs = [];
  if (b.I.length) dirs.push('0');
  if (b.R.length) dirs.push('1');
  if (!state.dir || !dirs.includes(state.dir)){ state.dir = dirs[0] || null; fresh = true; }
  state.showAllDirs = dirs.length === 0;
  state.liveOnly = true;
  state.busColor = color;

  const tabsEl = $('tabs');
  tabsEl.innerHTML = '';
  const labels = { '0': 'Ida', '1': 'Regreso' };
  for (const d of dirs){
    const t = document.createElement('button');
    t.className = 'tab' + (d === state.dir ? ' active' : '');
    t.textContent = labels[d];
    t.addEventListener('click', () => { state.dir = d; renderLiveOnly(route, true); });
    tabsEl.appendChild(t);
  }
  tabsEl.hidden = !dirs.length;

  $('variant-note').textContent = '';
  $('variants').innerHTML = '';
  $('meta').innerHTML = '';
  $('stops-head').textContent = 'Buses en tiempo real · ' + currentBuses().length + ' en total';
  // Transito a Servicio (TxTS): sin mensaje ni recuadro de paraderos
  $('stops').hidden = !!route.__ts;
  $('stops').innerHTML = route.__ts ? '' : '<div class="stop-row">' + escapeHtml(route.__live
    ? LIVE_INFO_MSG
    : route.__inj
      ? 'Este código existe en el DECO, pero no coincide con ningún recorrido del GTFS cargado: solo se muestran los buses en tiempo real.'
      : 'Sin viajes registrados para este recorrido: solo se muestran los buses en tiempo real.') + '</div>';
  drawLiveOnlyMap(fresh);
}

async function drawLiveOnlyMap(fit){
  if (typeof L === 'undefined'){
    mapMessage('Cargando mapa…');
    try { await libLeaflet; }
    catch (e){ mapMessage('No se pudo cargar el mapa (se necesita conexión a internet).'); return; }
  }
  mapMessage('');
  const map = ensureMap();
  if (!map) return;
  map.invalidateSize();
  state.layer.clearLayers();
  drawBuses(fit);
}

// En cada actualización: se redibujan solo los buses (sin mover el mapa)
function refreshDetailBuses(){
  const g = state.gtfs;
  if (!g || !state.routeId || $('detail-inner').hidden) return;
  const route = g.routesById.get(state.routeId);
  if (!route) return;
  if ((g.tripsByRoute.get(route.route_id) || []).length) drawBuses(false);
  else if (route.__live || (g.liveBy && g.liveBy.has(state.entryKey))) renderLiveOnly(route, false);
}

function renderFileLabel(){
  const g = state.gtfs;
  const el = $('file-name');
  const parts = [];
  if (state.fileLabel) parts.push(escapeHtml(state.fileLabel));
  const down = state.liveErr || (g && g.liveAt && g.liveTotal <= 1);
  if (down){
    parts.push('<span class="gps-bad">' + GPS_DOWN_MSG + '</span>');
  } else if (g && g.liveAt){
    parts.push('GPS ' + new Date(g.liveAt).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }));
  }
  el.innerHTML = parts.join(' · ');
}

async function pollLive(){
  if (liveBusy) return;
  liveBusy = true;
  try {
    const feats = await fetchLive();
    state.liveRaw = feats; state.liveErr = false;
    applyLive(feats);
  } catch (e){
    console.warn('Buses en tiempo real:', e);
    state.liveErr = true; renderFileLabel();
  } finally { liveBusy = false; }
}

function startLive(){
  if (state.liveRaw) applyLive(state.liveRaw);   // GTFS recargado: se reutiliza el último dato
  pollLive();
  if (!liveTimer) liveTimer = setInterval(() => { if (!document.hidden) pollLive(); }, LIVE_EVERY);
  if (!contTimer) contTimer = setInterval(() => { if (!document.hidden) checkCont(); }, CONT_EVERY);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.gtfs) pollLive(); });


/* =====================================================================
   PLAN CONTINGENCIA RED  ·  data/contingencia.json (repo stpm_gtfs)
   Formato:
   { "apoyos": [ { "servicio": "B20",
                   "apoyan": [ { "codigo": "T1590 00I", "sentido": "Ida" }, ... ] } ] }
   - servicio : CODIGO_USUARIO del servicio apoyado (ej. B20)
   - codigo   : código del bus que apoya (con o sin variante: T1590 / T1590 00I)
   - sentido  : "Ida" o "Regreso" (obligatorio; si el código termina en I/R, se usa ese)
   - en       : (opcional) pestaña del servicio apoyado donde se ve; por defecto = sentido
   - operadora: (opcional) "U15"; por defecto sale del código (T1590 → U15, T293 → U2)
   - apoyo    : (opcional, por defecto true) false = NO es apoyo: el servicio no aparece en el
                PLAN CONTINGENCIA RED. Los buses con ese código se asignan al servicio (ej. B46) y este
                pasa a su operadora (la de \"operadora\" o la del código: T1826 → U18), no a SIN MATCH.
                Si el servicio existe en el GTFS se usa toda su información (paraderos, horarios, GPS);
                si no existe, se muestran solo los buses en tiempo real.
   - activo   : (opcional) false para desactivar un servicio sin borrarlo
   ===================================================================== */
const CONT_EVERY = 120000;
const dirTxt = v => { const t = lc(v); return t.startsWith('i') ? 'I' : t.startsWith('r') ? 'R' : ''; };

// Servicios con "apoyo": false → { servicio, codigo (base), op } por cada código listado
function parseOwn(cfg){
  const list = Array.isArray(cfg) ? cfg : (cfg && (cfg.apoyos || cfg.contingencia));
  const out = [];
  if (!Array.isArray(list)) return out;
  for (const it of list){
    if (!it || it.activo === false) continue;
    if (!(it.apoyo === false || /^(false|no)$/i.test(String(it.apoyo == null ? '' : it.apoyo).trim()))) continue;
    const servicio = String(it.servicio == null ? '' : it.servicio).trim();
    if (!servicio) continue;
    for (const a of (Array.isArray(it.apoyan) ? it.apoyan : [])){
      const o = (typeof a === 'string') ? { codigo: a } : (a || {});
      const codigo = String(o.codigo == null ? '' : o.codigo).trim();
      if (!codigo) continue;
      out.push({ servicio, codigo: stripVar(codigo), op: o.operadora ? String(o.operadora).trim() : '' });
    }
  }
  return out;
}

function parseCont(cfg){
  const list = Array.isArray(cfg) ? cfg : (cfg && (cfg.apoyos || cfg.contingencia));
  const out = [];
  if (!Array.isArray(list)) return out;
  for (const it of list){
    if (!it || it.activo === false) continue;
    // apoyo:false → no es servicio de apoyo: no entra al PLAN CONTINGENCIA RED, solo se ve en el listado normal
    if (it.apoyo === false || /^(false|no)$/i.test(String(it.apoyo == null ? '' : it.apoyo).trim())) continue;
    const servicio = String(it.servicio == null ? '' : it.servicio).trim();
    if (!servicio) continue;
    const apoyan = [], codes = [];
    let hadCode = false;
    for (const a of (Array.isArray(it.apoyan) ? it.apoyan : [])){
      const o = (typeof a === 'string') ? { codigo: a } : (a || {});
      const codigo = String(o.codigo == null ? '' : o.codigo).trim();
      if (!codigo) continue;
      hadCode = true;
      const sfx = codigo.match(/\s+\d\d([IR])$/i);
      const dir = dirTxt(o.sentido) || (sfx ? sfx[1].toUpperCase() : '');
      if (!dir){ console.warn('contingencia.json: falta "sentido" (Ida/Regreso) para ' + codigo); continue; }
      apoyan.push({ codigo, base: lc(stripVar(codigo)), dir, en: dirTxt(o.en) || dir,
                    op: o.operadora ? String(o.operadora).trim() : '' });
      codes.push(codigo);
    }
    if (apoyan.length) out.push({ servicio, apoyan, codes });
    else if (!hadCode) out.push({ servicio, apoyan: [], codes: [], pending: true });   // sin códigos = no confirmado
  }
  return out;
}

// null = no se pudo leer (se mantiene lo anterior) · cfg null con sig 'none' = el archivo no existe
async function loadCont(){
  try {
    const r = await fetch(RAW_BASE + 'contingencia.json', { cache: 'no-store' });
    if (r.status === 404) return { cfg: null, sig: 'none' };
    if (!r.ok) throw new Error('HTTP ' + r.status);
    let txt = await r.text();
    if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1);
    return { cfg: JSON.parse(txt), sig: txt };
  } catch (e){
    console.warn('contingencia.json:', e);
    return null;
  }
}

const CONT_UNC_COLOR = 'F57C00';

// Código de apoyo + empresa (nombre completo): "T1590 00I · U15 - Nombre de la operadora"
function contLines(c){
  return c.items.map(it => it.codigo + (it.empresa ? ' · ' + it.empresa : ''));
}

// Crea la sección "PLAN CONTINGENCIA RED": un ítem amarillo por servicio apoyado.
// Servicios del json que no existen en el DECO/GTFS (no confirmados) → ítem naranjo, no seleccionable.
function applyCont(g, cfg){
  if (g.contEntries) for (const e of g.contEntries.values()){
    const i = g.entries.indexOf(e); if (i >= 0) g.entries.splice(i, 1);
  }
  g.contEntries = new Map(); g.contSupBy = new Map(); g.contCodes = new Set();
  // Se deshacen los cambios de operadora de la vez anterior
  if (g.ownMoved) for (const m of g.ownMoved){
    m.e.sub = m.sub; m.e.key = m.key; m.e.search = m.search; m.e.r.__subs = m.subs;
  }
  g.ownMoved = [];
  g.contOwn = new Map();
  for (const o of parseOwn(cfg)) g.contOwn.set(lc(o.codigo), o);
  // Servicios del GTFS sin operadora en el DECO (SIN MATCH) pero con operadora indicada en el json → a su operadora
  const movedRoutes = new Set();
  for (const o of g.contOwn.values()){
    const sub = ownSub(g, o);
    if (sub === NO_MATCH) continue;
    for (const e of ((g.entriesByUser && g.entriesByUser.get(lc(o.servicio))) || [])){
      if (e.r.__live || e.r.__inj || e.cont || e.sub !== NO_MATCH || movedRoutes.has(e)) continue;
      movedRoutes.add(e);
      g.ownMoved.push({ e, sub: e.sub, key: e.key, search: e.search, subs: e.r.__subs });
      e.sub = sub; e.key = e.r.route_id + '|' + sub; e.r.__subs = [sub];
      e.search += ' ' + norm(sub) + ' ' + norm(o.codigo);
    }
  }
  // Los recorridos sin informar se re-crean (con la operadora que corresponda a los códigos de apoyo)
  for (const e of [...g.liveEntries.values()]) dropLive(g, e);

  for (const sv of parseCont(cfg)){
    const list = g.entriesByUser.get(lc(sv.servicio)) || [];
    const base = list.find(e => !e.r.__inj) || list[0];
    const unc = sv.pending || !base;
    const key = (unc ? 'cont-unc:' : 'cont:') + lc(sv.servicio) + '|';
    const items = sv.apoyan.map(a => {
      const empresa = opForCode(g, a.codigo, a.op) ||
        (() => { const m = /^T(\d{3,4})(?!\d)/i.exec(a.codigo) || null; const n = a.op ? (/(\d+)/.exec(a.op) || [])[1] : (m ? m[1].slice(0, -2) : null); return n ? 'U' + n : ''; })();
      return { codigo: a.codigo, empresa };
    });
    g.contCodes.add(lc(sv.servicio));
    for (const a of sv.apoyan) g.contCodes.add(a.base);
    let e = g.contEntries.get(key);
    if (e){
      e.cont.codes.push(...sv.codes); e.cont.items.push(...items);
    } else if (unc){
      const r = {
        route_id: '__unc:' + lc(sv.servicio), route_short_name: sv.servicio,
        route_long_name: 'Recorrido no confirmado',
        route_color: CONT_UNC_COLOR, route_text_color: 'FFFFFF',
        __unc: true, __group: CONT_GROUP, __agency: CONT_TITLE, __subs: [null]
      };
      const lbl = (base && base.label) || sv.servicio;
      r.route_short_name = lbl;
      e = { r, sub: null, label: lbl, key,
            search: norm(CONT_TITLE + ' ' + lbl + ' recorrido no confirmado'),
            cont: { servicio: sv.servicio, codes: [...sv.codes], items: [...items], baseEntries: [] } };
      g.contEntries.set(key, e);
      g.entries.push(e);
    } else {
      const r = Object.create(base.r);
      r.route_color = 'FFD000'; r.route_text_color = '1A1A1C'; r.__group = CONT_GROUP;
      e = { r, sub: null, label: base.label, key,
            search: norm(CONT_TITLE + ' ' + base.label + ' ' + base.r.__search),
            cont: { servicio: sv.servicio, codes: [...sv.codes], items: [...items], baseEntries: list } };
      g.contEntries.set(key, e);
      g.entries.push(e);
    }
    e.search += ' ' + norm(sv.codes.join(' ')) + ' ' + norm(items.map(i => i.empresa).join(' '));
    for (const a of sv.apoyan){
      let arr = g.contSupBy.get(a.base);
      if (!arr){ arr = []; g.contSupBy.set(a.base, arr); }
      arr.push({ key, dir: a.dir, en: a.en, op: a.op });
    }
  }
  g.entries.sort(entryCmp);
}

// Entrada de contingencia que se está viendo (null si es un recorrido normal)
function curCont(){
  const g = state.gtfs;
  return (g && g.contEntries && state.entryKey && g.contEntries.get(state.entryKey)) ? g.contEntries.get(state.entryKey).cont : null;
}

// Revisa si cambió contingencia.json (se puede editar en el repo sin recargar la página)
async function checkCont(){
  const g = state.gtfs;
  if (!g) return;
  const c = await loadCont();
  if (!c || c.sig === contSig) return;
  contSig = c.sig;
  applyCont(g, c.cfg);
  ensureSelection(g);
  const el = $('results'), top = el.scrollTop;
  renderResults($('search').value);
  el.scrollTop = top;
  if (state.liveRaw) applyLive(state.liveRaw);
}

// Inicio: cargar automáticamente el GTFS más reciente
autoLoad();
</script>
