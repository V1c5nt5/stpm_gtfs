<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor en Tiempo Real - Red Movilidad</title>
<style>
  *{box-sizing:border-box}
  /* FIX #1: sin esto, display:flex/grid de las clases anula el atributo [hidden]
     y el overlay "Cargando…" quedaba tapando toda la pantalla para siempre. */
  [hidden]{display:none !important}

  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f5f5f7;color:#1a1a1c;font-size:14px;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:16px;
    padding:0 20px;height:54px;flex-shrink:0;
    background:#fff;border-bottom:1px solid #e3e3e6;
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand-dot{width:10px;height:10px;border-radius:3px;background:#d81e05}
  header h1{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .spacer{flex:1}
  #file-name .gps-bad{color:#d81e05;font-weight:700}
  #file-name{font-size:12px;color:#86868b;max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border:1px solid #d6d6db;background:#fff;
    border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:#1a1a1c;
    font-family:inherit;transition:background .12s;
  }
  .file-btn:hover{background:#f2f2f4}
  .file-btn.primary{background:#1a1a1c;color:#fff;border-color:#1a1a1c}
  .file-btn.primary:hover{background:#333}
  #file-input{display:none}

  /* ---------- Bienvenida ---------- */
  .welcome{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .welcome-box{
    width:100%;max-width:460px;text-align:center;padding:44px 28px;
    background:#fff;border:1.5px dashed #d6d6db;border-radius:14px;
    transition:border-color .15s,background .15s;
  }
  .welcome-box.drag{border-color:#d81e05;background:#fff8f7}
  .welcome-icon{font-size:30px;margin-bottom:10px;opacity:.75}
  .welcome-box h2{font-size:16px;margin:0 0 6px;font-weight:600}
  .welcome-box p{font-size:12.5px;color:#86868b;margin:0 0 20px;line-height:1.5}

  /* ---------- Layout ---------- */
  .layout{flex:1;display:flex;min-height:0}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:340px;flex-shrink:0;background:#fff;
    border-right:1px solid #e3e3e6;display:flex;flex-direction:column;min-height:0;
  }
  .search-wrap{padding:12px;border-bottom:1px solid #e3e3e6}
  #search{
    width:100%;padding:9px 12px;border:1px solid #d6d6db;border-radius:8px;
    font-size:13.5px;font-family:inherit;outline:none;background:#fafafb;color:inherit;
  }
  #search:focus{border-color:#9a9aa0;background:#fff}
  .count{font-size:11px;color:#9a9aa0;margin-top:7px}
  .results{flex:1;overflow-y:auto;padding:8px}
  .results::-webkit-scrollbar{width:9px}
  .results::-webkit-scrollbar-thumb{background:#d6d6db;border-radius:5px;border:2px solid #fff}

  .route-item{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:8px 10px;border:none;background:transparent;border-radius:8px;
    cursor:pointer;text-align:left;font-family:inherit;font-size:13px;
    color:inherit;transition:background .1s;
  }
  .route-item:hover{background:#f2f2f4}
  .route-item.active{background:#ececef}

  .route-badge{
    flex-shrink:0;min-width:56px;padding:6px 8px;border-radius:6px;
    font-weight:700;font-size:13px;text-align:center;
    letter-spacing:.01em;line-height:1.15;word-break:break-word;
  }
  .route-text{min-width:0;flex:1;display:block}
  /* FIX: eran <span> inline, por lo que el text-overflow:ellipsis no funcionaba */
  .route-dest{
    display:block;
    font-size:13px;font-weight:500;color:#1a1a1c;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .route-sub{
    display:block;
    font-size:11.5px;color:#86868b;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .group-sep{
    display:flex;align-items:center;gap:8px;margin:14px 4px 6px;
    font-size:10.5px;font-weight:700;letter-spacing:.07em;color:#9a9aa0;
    text-transform:uppercase;
  }
  .group-sep::after{content:"";flex:1;height:1px;background:#e3e3e6}
  .group-sep:first-child{margin-top:4px}
  .sub-sep{
    display:flex;align-items:baseline;gap:7px;margin:12px 4px 4px 6px;padding-left:8px;
    border-left:3px solid #d81e05;font-size:11.5px;font-weight:700;color:#3a3a40;
  }
  .sub-sep .n{font-weight:500;color:#9a9aa0;font-size:11px}
  .route-item.inj{cursor:default;user-select:none}
  .route-item.inj:hover{background:transparent}
  .route-item.inj .route-dest{color:#8a8a90;font-style:italic}
  .empty-list{padding:36px 16px;text-align:center;color:#a0a0a6;font-size:13px}

  /* ---------- Detalle ---------- */
  .detail{
    flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
    overflow:hidden;background:#f5f5f7;position:relative;
  }
  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    height:100%;color:#a0a0a6;font-size:13.5px;padding:24px;text-align:center;overflow:auto;
  }
  .changelog{
    width:100%;max-width:440px;background:#fff;border:1px solid #e3e3e6;border-radius:10px;
    padding:14px 18px;text-align:left;color:#3a3a3c;font-size:12.5px;line-height:1.45;
  }
  .changelog h4{margin:0 0 8px;font-size:12px;font-weight:700;color:#1d1d1f;letter-spacing:.2px}
  .changelog h4 span{font-weight:500;color:#86868b}
  .changelog ul{margin:0;padding-left:18px}
  .changelog li{margin:3px 0}
  .detail-inner{flex:1;display:flex;flex-direction:column;min-height:0}

  .detail-head{
    padding:14px 20px;background:#fff;border-bottom:1px solid #e3e3e6;
    display:flex;gap:14px;align-items:center;flex-shrink:0;
  }
  .route-badge.lg{font-size:16px;padding:9px 13px;min-width:66px;border-radius:7px}
  .detail-title{font-size:14.5px;font-weight:600;line-height:1.3}
  .detail-sub{font-size:12px;color:#86868b;margin-top:2px}

  .map-wrap{height:330px;flex-shrink:0;position:relative;background:#e8e8ea}
  #map{position:absolute;inset:0}
  .map-msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#86868b;font-size:13px;padding:20px;text-align:center;z-index:500;
  }
  .leaflet-container{font-family:inherit}
  /* Rectángulo con la PPU sobre cada bus en tiempo real */
  .bus-tip{
    font-weight:700;font-size:11px;letter-spacing:.02em;padding:2px 6px;border-radius:3px;
    background:#1a1a1c;color:#fff;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .bus-tip.leaflet-tooltip-top:before{border-top-color:#1a1a1c}
  .group-sep.cont{color:#a37c00}
  .route-item.unc{cursor:default;user-select:none}
  .route-item.unc:hover{background:transparent}
  .route-item.unc .route-dest{color:#c25e00;font-style:italic}
  .route-item.cont .route-sub,.route-item.unc .route-sub{white-space:normal;line-height:1.35}
  .detail-sub{white-space:normal}

  .detail-body{flex:1;overflow-y:auto;padding:16px 20px 48px}
  .detail-body::-webkit-scrollbar{width:10px}
  .detail-body::-webkit-scrollbar-thumb{background:#d0d0d5;border-radius:5px;border:3px solid #f5f5f7}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{
    padding:7px 15px;border:1px solid #d6d6db;background:#fff;border-radius:7px;
    font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:#6b6b72;
    transition:all .12s;
  }
  .tab:hover{background:#f5f5f7}
  .tab.active{background:#1a1a1c;color:#fff;border-color:#1a1a1c}

  .variants{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .variant{
    padding:6px 13px;border:1px solid #e3c200;background:#ffe45c;border-radius:20px;
    font-size:12px;cursor:pointer;font-family:inherit;color:#3a3000;font-weight:500;
    transition:all .12s;
  }
  .variant:hover{background:#ffd92e}
  .variant.active{background:#ffd000;border-color:#1a1a1c;color:#1a1a1c;font-weight:700;box-shadow:0 0 0 1px #1a1a1c inset}
  .variant .now{font-size:10px;font-weight:600;margin-left:4px;color:#1d6b2f}
  .variant-note{font-size:12px;color:#86868b;margin-bottom:14px;min-height:0}
  .variant-note:empty{display:none}
  .variants:empty{display:none}

  .meta{
    display:flex;flex-wrap:wrap;gap:22px;padding:14px 16px;background:#fff;
    border:1px solid #e3e3e6;border-radius:10px;margin-bottom:18px;
  }
  .meta-block{display:flex;flex-direction:column;gap:5px}
  .meta-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9a9aa0;font-weight:600}
  .meta-value{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
  .days{display:flex;gap:4px}
  .day{
    width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;background:#ececef;color:#b0b0b6;
  }
  .day.on{background:#1a1a1c;color:#fff}

  .stops-head{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:#9a9aa0;font-weight:600;margin-bottom:10px;
  }
  .stops{background:#fff;border:1px solid #e3e3e6;border-radius:10px;overflow:hidden}
  .stop-row{
    display:flex;align-items:center;gap:11px;padding:9px 14px;
    border-bottom:1px solid #f0f0f2;cursor:pointer;transition:background .1s;
  }
  .stop-row:last-child{border-bottom:none}
  .stop-row:hover{background:#fafafb}
  .stop-rail{position:relative;width:12px;flex-shrink:0;align-self:stretch;display:flex;align-items:center;justify-content:center}
  .stop-rail::before{
    content:"";position:absolute;top:0;bottom:0;width:2px;background:#e3e3e6;
  }
  .stop-row:first-child .stop-rail::before{top:50%}
  .stop-row:last-child .stop-rail::before{bottom:50%}
  .stop-dot{
    position:relative;width:8px;height:8px;border-radius:50%;
    background:#fff;border:2px solid #b0b0b6;z-index:1;
  }
  .stop-row:first-child .stop-dot,.stop-row:last-child .stop-dot{
    width:10px;height:10px;border-color:#1a1a1c;
  }
  .stop-idx{
    font-size:11px;color:#a0a0a6;width:22px;flex-shrink:0;
    text-align:right;font-variant-numeric:tabular-nums;
  }
  .stop-name{flex:1;font-size:13px;color:#2a2a2e;line-height:1.35}

  .welcome-box .file-btn{margin:0 4px}
  #welcome-msg{word-break:break-word}

  /* Horarios por tipo de día (a la derecha de "Días de operación") */
  .meta-sep{width:1px;background:#e3e3e6;align-self:stretch}
  .sched-lines{display:flex;flex-direction:column;gap:3px}
  .sched-line{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sched-24{font-size:10.5px;font-weight:700;color:#1d6b2f;letter-spacing:.04em;text-transform:uppercase}
  .sched-none{font-size:13px;color:#a0a0a6}

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:9999;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  }
  .overlay-box{display:flex;flex-direction:column;align-items:center;gap:14px}
  .spinner{
    width:28px;height:28px;border:2.5px solid #e3e3e6;border-top-color:#d81e05;
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #overlay-text{font-size:13px;color:#6b6b72;text-align:center;max-width:320px}

  @media (max-width:820px){
    .layout{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid #e3e3e6;max-height:42vh}
    .map-wrap{height:240px}
    #file-name{max-width:46vw;font-size:11px}
    header{padding:0 12px;gap:8px}
    header h1{font-size:13px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Monitor en Tiempo Real - Red Movilidad</h1>
  </div>
  <div class="spacer"></div>
  <span id="file-name"></span>
</header>

<!-- Solo se muestra si la carga automática falla -->
<div class="welcome" id="welcome" hidden>
  <div class="welcome-box" id="dropzone">
    <div class="welcome-icon">⚠️</div>
    <h2>No se pudo cargar el GTFS automáticamente</h2>
    <p id="welcome-msg"></p>
    <button class="file-btn primary" id="retry-btn" type="button">Reintentar</button>
    <label class="file-btn" for="file-input">Seleccionar .zip manualmente</label>
    <input type="file" id="file-input" accept=".zip,application/zip,application/x-zip-compressed">
  </div>
</div>

<div class="layout" id="layout" hidden>
  <aside class="sidebar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Buscar recorrido o destino…" autocomplete="off" spellcheck="false">
      <div class="count" id="count"></div>
    </div>
    <div class="results" id="results"></div>
  </aside>

  <main class="detail">
    <div class="empty" id="detail-empty">
      <div>Selecciona un recorrido de la lista</div>
      <div class="changelog" id="changelog" hidden></div>
    </div>

    <div class="detail-inner" id="detail-inner" hidden>
      <div class="detail-head">
        <div class="route-badge lg" id="detail-badge">--</div>
        <div style="min-width:0">
          <div class="detail-title" id="detail-title"></div>
          <div class="detail-sub" id="detail-sub"></div>
        </div>
      </div>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-msg" id="map-msg" hidden></div>
      </div>
      <div class="detail-body">
        <div class="tabs" id="tabs" hidden></div>
        <div class="variants" id="variants"></div>
        <div class="variant-note" id="variant-note"></div>
        <div class="meta" id="meta"></div>
        <div class="stops-head" id="stops-head"></div>
        <div class="stops" id="stops"></div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="spinner"></div>
    <div id="overlay-text">Buscando el GTFS más reciente…</div>
  </div>
</div>

<script>
function loadScript(urls, check){
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (check()) return resolve();
      if (i >= urls.length) return reject(new Error('No se pudo cargar ' + urls[0]));
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => check() ? resolve() : tryNext();
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}
function loadCSS(urls){
  let i = 0;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.onerror = () => { if (i < urls.length) l.href = urls[i++]; };
  l.href = urls[i++];
  document.head.appendChild(l);
}

loadCSS([
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'
]);

const libJSZip = loadScript([
  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
  'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
], () => typeof JSZip !== 'undefined');
libJSZip.catch(() => {});

const libLeaflet = loadScript([
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
], () => typeof L !== 'undefined');
libLeaflet.catch(() => {});

const $ = id => document.getElementById(id);
const DEFAULT_COLOR = '#D81E05';
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const DAY_LBL = ['L','M','M','J','V','S','D'];

const nextFrame = () => new Promise(r => setTimeout(r, 0));
const norm = s => (s == null ? '' : String(s)).toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function readCSV(text, label, onHeader, onRow, delim){
  if (delim === undefined) delim = 44;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const n = text.length;
  let row = [], cur = '', fs = 0, inQ = false, quoted = false;
  let header = null, count = 0;

  const emit = () => {
    if (row.length === 1 && row[0] === '') { row = []; return; }
    if (!header){
      header = row.map(h => h.trim());
      onHeader(header);
    } else {
      onRow(row);
      count++;
    }
    row = [];
  };

  for (let i = 0; i < n; i++){
    const c = text.charCodeAt(i);
    if (inQ){
      if (c === 34){
        if (text.charCodeAt(i + 1) === 34){ cur += '"'; i++; }
        else inQ = false;
      } else cur += text[i];
    } else if (c === 34){
      inQ = true; quoted = true;
    } else if (c === delim){
      row.push(quoted ? cur : text.slice(fs, i));
      cur = ''; quoted = false; fs = i + 1;
    } else if (c === 10){
      let end = i;
      if (end > fs && text.charCodeAt(end - 1) === 13) end--;
      row.push(quoted ? cur : text.slice(fs, end));
      cur = ''; quoted = false; fs = i + 1;
      emit();
      if (count > 0 && count % 150000 === 0){
        showOverlay(label + ' · ' + count.toLocaleString('es') + ' filas…');
        await nextFrame();
      }
    }
  }
  if (fs < n || row.length || cur){
    let end = n;
    if (end > fs && text.charCodeAt(end - 1) === 13) end--;
    row.push(quoted ? cur : text.slice(fs, end));
    emit();
  }
  return count;
}

async function readObjects(text, label, delim){
  const out = [];
  let H = [];
  await readCSV(text, label, h => { H = h; }, r => {
    const o = {};
    for (let j = 0; j < H.length; j++) o[H[j]] = r[j] !== undefined ? r[j].trim() : '';
    out.push(o);
  }, delim);
  return out;
}

function normalizeColor(c){
  if (!c) return null;
  c = c.toString().trim().replace('#','');
  if (/^[0-9a-fA-F]{6}$/.test(c)) return '#' + c;
  if (/^[0-9a-fA-F]{3}$/.test(c)) return '#' + c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  return null;
}

function textColorFor(hex){
  const h = (hex || '').replace('#','');
  if (h.length !== 6) return '#fff';
  const r = parseInt(h.slice(0,2),16),
        g = parseInt(h.slice(2,4),16),
        b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 155 ? '#111' : '#fff';
}

function toSec(t){
  if (!t) return null;
  const p = String(t).trim().split(':');
  if (p.length < 2) return null;
  const h = parseInt(p[0],10), m = parseInt(p[1],10), s = p[2] ? parseInt(p[2],10) : 0;
  if (isNaN(h) || isNaN(m)) return null;
  return h*3600 + m*60 + (isNaN(s) ? 0 : s);
}
function fmtSec(sec){
  if (sec == null) return '';
  let h = Math.floor(sec/3600) % 24;
  const m = Math.floor((sec % 3600)/60);
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function fmtTime(t){ return fmtSec(toSec(t)); }

const state = {
  gtfs: null,
  routeId: null,
  dir: null,
  shapeId: null,
  map: null,
  layer: null,
  busLayer: null,      // buses en tiempo real (capa aparte de los paraderos)
  busColor: null,
  showAllDirs: false,  // circular / un solo sentido: se muestran los buses de ambos sentidos
  liveOnly: false,     // recorrido sin trazado (solo buses)
  liveRaw: null, liveErr: false, fileLabel: '', openBus: null, redrawing: false,
};

function showOverlay(msg){ $('overlay-text').textContent = msg; $('overlay').hidden = false; }
function hideOverlay(){ $('overlay').hidden = true; }

$('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadGTFSFile(f);

/* =====================================================================
   CARGA AUTOMÁTICA DEL GTFS MÁS RECIENTE
   Repo: github.com/V1c5nt5/stpm_gtfs  ·  carpeta /data
   Archivos: GTFS_<AAAAMMDD>.zip  → se elige el de fecha más nueva.
   ===================================================================== */
const REPO = { owner: 'V1c5nt5', repo: 'stpm_gtfs', branch: 'main', dir: 'data' };
const RAW_BASE = 'https://raw.githubusercontent.com/' + REPO.owner + '/' + REPO.repo + '/' + REPO.branch + '/' + REPO.dir + '/';
const GTFS_NAME_RE = /^GTFS_.*\.zip$/i;
const KNOWN_GTFS = 'GTFS_20261003.zip';   // último recurso si no se puede listar la carpeta
const MAX_TRIES = 3;                      // cuántos GTFS (del más nuevo al más viejo) probar

const gtfsKey = name => { const m = name.match(/(\d{8})/); return m ? m[1] : '00000000'; };

const DECO_NAME_RE = /^DECO_VIGENTES_.*\.zip$/i;
const KNOWN_DECO = 'DECO_VIGENTES_20260829.zip';
// DECO_VIGENTES_<AAAAMMDD> o DECO_VIGENTES_<AAAAMMDDhhmm>: se comparan como fecha(+hora)
const decoKey = name => { const m = name.match(/DECO_VIGENTES_(\d+)/i); return (m ? m[1] : '').padEnd(14, '0'); };

function sortCandidates(names, re, keyFn){
  return [...new Set(names)]
    .filter(n => re.test(n))
    .sort((a, b) => keyFn(b).localeCompare(keyFn(a)) || b.localeCompare(a))
    .map(n => ({ name: n, url: RAW_BASE + encodeURIComponent(n) }));
}
const sortGTFS = names => sortCandidates(names, GTFS_NAME_RE, gtfsKey);
const sortDECO = names => sortCandidates(names, DECO_NAME_RE, decoKey);

async function fetchJSON(url){
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Lista los nombres de archivo de /data (API de GitHub → jsDelivr). null si ninguna funciona.
async function listDataDir(){
  try {
    const list = await fetchJSON('https://api.github.com/repos/' + REPO.owner + '/' + REPO.repo +
                                 '/contents/' + REPO.dir + '?ref=' + REPO.branch);
    const names = list.filter(f => f.type === 'file').map(f => f.name);
    if (names.length) return names;
  } catch (e){ console.warn('API GitHub falló:', e); }
  try {
    const j = await fetchJSON('https://data.jsdelivr.com/v1/packages/gh/' + REPO.owner + '/' + REPO.repo +
                              '@' + REPO.branch + '?structure=flat');
    const pre = '/' + REPO.dir + '/';
    const names = (j.files || []).map(f => f.name)
      .filter(n => n.startsWith(pre) && n.slice(pre.length).indexOf('/') < 0)
      .map(n => n.slice(pre.length));
    if (names.length) return names;
  } catch (e){ console.warn('jsDelivr falló:', e); }
  return null;
}

// Último recurso: probar fechas hacia atrás (incluye días futuros, ya que se publican con anticipación)
async function probeNames(prefix){
  const pad = n => String(n).padStart(2, '0');
  const today = new Date();
  const found = [];
  for (let off = -30; off < 150; off += 15){
    const batch = [];
    for (let i = off; i < off + 15; i++){
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      const name = prefix + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.zip';
      batch.push(fetch(RAW_BASE + name, { method: 'HEAD' })
        .then(r => { if (r.ok) found.push(name); }).catch(() => {}));
    }
    await Promise.all(batch);
    if (found.length) break;
  }
  return found;
}

async function discoverAll(){
  showOverlay('Buscando el GTFS y el DECO más recientes…');
  const names = await listDataDir();
  let gtfs = [], deco = [];
  if (names){
    gtfs = sortGTFS(names); deco = sortDECO(names);
  } else {
    try { gtfs = sortGTFS(await probeNames('GTFS_')); } catch (e){}
    try { deco = sortDECO(await probeNames('DECO_VIGENTES_')); } catch (e){}
  }
  if (!gtfs.length) gtfs = sortGTFS([KNOWN_GTFS]);
  if (!deco.length) deco = sortDECO([KNOWN_DECO]);
  return { gtfs, deco };
}

async function downloadFile(c, silent){
  if (!silent) showOverlay('Descargando ' + c.name + '…');
  const resp = await fetch(c.url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' al descargar ' + c.name);
  const total = +resp.headers.get('content-length') || 0;
  if (silent || !resp.body || !resp.body.getReader) return await resp.arrayBuffer();
  const reader = resp.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    showOverlay('Descargando ' + c.name + ' · ' +
      (total ? Math.min(100, Math.round(got / total * 100)) + '%' : (got / 1048576).toFixed(1) + ' MB'));
  }
  const out = new Uint8Array(got);
  let o = 0;
  for (const ch of chunks){ out.set(ch, o); o += ch.length; }
  return out.buffer;
}

/* DECO (Diccionario de Servicios): CSV separado por ';'.
   Solo se usan CODIGO_USUARIO y CLI_DSC. Es opcional: si falla, se sigue sin subcategorías. */
async function loadDeco(cands){
  try { await libJSZip; } catch (e){ return null; }
  for (const c of cands){
    try {
      const buf = await downloadFile(c, true);
      const zip = await JSZip.loadAsync(buf);
      const f = zip.file(/\.csv$/i).filter(x => !/(^|\/)__MACOSX\//.test(x.name))[0];
      if (!f) throw new Error('El zip no contiene un .csv');
      const txt = await f.async('string');
      const first = txt.slice(0, Math.max(0, txt.indexOf('\n')));
      const delim = first.split(';').length > first.split(',').length ? 59 : 44;
      const rows = await readObjects(txt, 'DECO', delim);
      if (!rows.length || !('CODIGO_USUARIO' in rows[0]) || !('CLI_DSC' in rows[0]))
        throw new Error('El DECO no trae las columnas CODIGO_USUARIO y CLI_DSC');
      return { name: c.name, rows };
    } catch (e){ console.warn('DECO ' + c.name + ' falló:', e); }
  }
  return null;
}
